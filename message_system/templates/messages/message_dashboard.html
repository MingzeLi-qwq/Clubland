{% extends 'base.html' %}
{% load static %}

{% block body %}
<div id="app">
    <div class="chat-container">
        <!-- 左侧消息列表 -->
        <div class="sidebar">
            <h5>Messages</h5>

            <!-- 搜索栏 -->
            <input type="text" v-model="searchQuery" placeholder="Search users..." class="search-input">

            <ul class="chat-list">
                <li v-for="(chat, index) in filteredChatList" :key="index" @click="selectChat(index)" :class="{ active: currentChatIndex === index }">
                    <div class="icon-wrapper">
                        <i :class="chat.icon"></i>
                    </div>
                    <div>
                        <strong>{{ chat.name }}</strong>
                        <p style="margin:0; font-size: 12px; color: gray;">{{ chat.lastMessage }}</p>
                    </div>
                </li>
            </ul>
        </div>

        <!-- 右侧聊天框 -->
        <div class="chat-content">
            <div class="chat-header">
                <strong>{{ currentChat.name }}</strong>
                <button class="btn btn-outline-secondary btn-sm">Setting</button>
            </div>

            <div class="chat-box">
                <div v-for="(msg, index) in currentChat.messages" :key="index" :class="['chat-message', msg.sender]">
                    <p>{{ msg.text }}</p>
                </div>
            </div>

            <!-- 输入框 -->
            <div class="chat-footer">
                <textarea v-model="newMessage" 
                          @keydown="handleKeyPress"
                          placeholder="Input Message..." 
                          class="message-input"></textarea>
                <button @click="sendMessage" class="send-btn">Send</button>
            </div>
        </div>
    </div>
</div>

<!-- Vue 逻辑 -->
{% block extra_js %}
<script>
    function getCSRFToken() {
        return document.cookie.split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
    }
    
    const app = Vue.createApp({
        data() {
            return {
                chatList: [],
                searchQuery: "",
                currentChatIndex: 0,
                newMessage: "",
            };
        },
        computed: {
            filteredChatList() {
                if (!this.searchQuery.trim()) return this.chatList;
                return this.chatList.filter(chat => 
                    chat.name.toLowerCase().includes(this.searchQuery.toLowerCase())
                );
            },
            currentChat() {
                return this.chatList[this.currentChatIndex] || { name: "", messages: [] };
            }
        },
        methods: {
            fetchMessages() {
                fetch('/api/messages/')
                    .then(response => response.json())
                    .then(data => {
                        this.chatList = data.messages.map(msg => ({
                            name: msg.sender,
                            avatar: "https://via.placeholder.com/40",
                            lastMessage: msg.text,
                            messages: [{ text: msg.text, sender: "other" }]
                        }));
                    })
                    .catch(error => console.error("Failed to load messages:", error));
            },
            searchUsers() {
                if (!this.searchQuery.trim()) return;
                fetch(`/api/search_users/?q=${this.searchQuery}`)
                    .then(response => response.json())
                    .then(data => {
                        this.chatList = data.users.map(user => ({
                            name: user.username,
                            avatar: "https://via.placeholder.com/40",
                            lastMessage: "",
                            messages: []
                        }));
                    })
                    .catch(error => console.error("Failed to search users:", error));
            },
            sendMessage() {
                if (this.newMessage.trim() && this.currentChat) {
                    fetch('/api/send/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCSRFToken()
                        },
                        body: JSON.stringify({
                            receiver: this.currentChat.name,
                            text: this.newMessage
                        })
                    }).then(response => response.json())
                      .then(() => {
                          this.currentChat.messages.push({ text: this.newMessage, sender: "me" });
                          this.newMessage = "";
                      })
                      .catch(error => console.error("Failed to send message:", error));
                }
            },
            selectChat(index) {
                this.currentChatIndex = index;
            }
        },
        watch: {
            searchQuery() {
                this.searchUsers();
            }
        },
        mounted() {
            this.fetchMessages();
        }
    }).mount("#app");
</script>
{% endblock %}

<!-- 引入 FontAwesome 图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- CSS 样式优化 -->
<style>
.chat-container {
    display: flex;
    height: 90vh;
}

.sidebar {
    width: 30%;
    background: #f4f4f4;
    padding: 10px;
    border-right: 1px solid #ddd;
}

.chat-list {
    list-style: none;
    padding: 0;
}

.chat-list li {
    display: flex;
    align-items: center;
    padding: 10px;
    cursor: pointer;
    transition: background 0.2s;
}

.chat-list li:hover, .chat-list li.active {
    background: #ddd;
}

.icon-wrapper {
    width: 40px;
    height: 40px;
    background: #007bff;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin-right: 10px;
    font-size: 18px;
}

.chat-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 10px;
    background: #007bff;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chat-box {
    flex-grow: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.chat-message {
    max-width: 60%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 10px;
}

.chat-message.other {
    background: #eaeaea;
    align-self: flex-start;
}

.chat-message.me {
    background: #007bff;
    color: white;
    align-self: flex-end;
}

.chat-footer {
    display: flex;
    align-items: center;
    padding: 10px;
    border-top: 1px solid #ddd;
}

.message-input {
    flex-grow: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    resize: none;
    height: 40px;
    overflow-y: auto;
}

.send-btn {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

.send-btn:hover {
    background: #0056b3;
}

.search-input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}
</style>

{% endblock %}
