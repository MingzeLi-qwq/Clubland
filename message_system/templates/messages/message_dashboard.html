{% extends 'base.html' %}

{% load static %}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心 - Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/vue@3.2.36/dist/vue.global.js"></script>
    <style>
        body {
            background: url("{% static 'images/chat_bg.png' %}") no-repeat center center;
            background-size: cover;
            font-family: "Arial", sans-serif;
        }
        .chat-container {
            display: flex;
            height: 90vh;
            max-width: 1200px;
            margin: auto;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #f5f7fa;
            padding: 15px;
            border-right: 1px solid #ddd;
        }
        .chat-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .chat-list li {
            padding: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
        }
        .chat-list li:hover, .chat-list li.active {
            background: #e0e6ed;
        }
        .chat-list img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .chat-message {
            max-width: 75%;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .chat-message.me {
            background: #009688;
            color: white;
            align-self: flex-end;
        }
        .chat-message.other {
            background: #e0e6ed;
            color: black;
            align-self: flex-start;
        }
        .chat-footer {
            padding: 10px;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
        }
        .chat-footer input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-right: 10px;
        }
        .chat-footer button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="chat-container">
        <!-- 左侧消息列表 -->
        <div class="sidebar">
            <h5>消息中心</h5>
            <ul class="chat-list">
                <li v-for="(chat, index) in chatList" :key="index" @click="selectChat(index)" :class="{ active: currentChatIndex === index }">
                    <img :src="chat.avatar" alt="Avatar">
                    <div>
                        <strong>{{ chat.name }}</strong>
                        <p style="margin:0; font-size: 12px; color: gray;">{{ chat.lastMessage }}</p>
                    </div>
                </li>
            </ul>
        </div>

        <!-- 右侧聊天框 -->
        <div class="chat-content">
            <div class="chat-header">
                <strong>{{ currentChat.name }}</strong>
                <button class="btn btn-outline-secondary btn-sm">设置</button>
            </div>

            <div class="chat-box">
                <div v-for="(msg, index) in currentChat.messages" :key="index" :class="['chat-message', msg.sender]">
                    <p>{{ msg.text }}</p>
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" v-model="newMessage" placeholder="输入消息...">
                <button @click="sendMessage">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
const app = Vue.createApp({
    data() {
        return {
            chatList: [
                { name: "无畏契约赛事", avatar: "https://via.placeholder.com/40", lastMessage: "🔥 快来看比赛", messages: [{ text: "你好！", sender: "other" }] },
                { name: "崩坏星穹铁道", avatar: "https://via.placeholder.com/40", lastMessage: "全新世界开启！", messages: [{ text: "你好呀！", sender: "other" }] },
                { name: "哔哩哔哩晚会", avatar: "https://via.placeholder.com/40", lastMessage: "直播开始提醒", messages: [{ text: "今晚看直播吗？", sender: "other" }] }
            ],
            currentChatIndex: 0,
            newMessage: "",
        };
    },
    computed: {
        currentChat() {
            return this.chatList[this.currentChatIndex];
        }
    },
    methods: {
        selectChat(index) {
            this.currentChatIndex = index;
        },
        sendMessage() {
            if (this.newMessage.trim()) {
                this.currentChat.messages.push({ text: this.newMessage, sender: "me" });
                this.newMessage = "";
            }
        }
    }
}).mount("#app");
</script>

</body>
</html>
