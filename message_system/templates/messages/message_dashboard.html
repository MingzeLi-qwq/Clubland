{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="chat-container">
    <!-- Message list on the left -->
    <div class="sidebar">
        <h5>Messages</h5>

       <!-- Search bar and search button -->
        <div class="search-bar">
            <input type="text" id="searchQuery" placeholder="Search users..." class="search-input">
            <button onclick="searchUsers()" class="search-btn">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <ul class="chat-list" id="chatList">
            <!-- Dynamically populate the chat list -->
        </ul>
    </div>

    <!-- Right chat box -->
    <div class="chat-content">
        <div class="chat-header">
            <strong id="chatName">Select a chat</strong>
        </div>

        <div class="chat-box" id="chatBox">
            <!-- Dynamically populate message -->
        </div>

        <!-- Input box -->
        <div class="chat-footer">
            <textarea id="newMessage" placeholder="Input Message..." class="message-input"></textarea>
            <button onclick="sendMessage()" class="send-btn">Send</button>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    const chatListElement = document.getElementById('chatList');
    const chatBoxElement = document.getElementById('chatBox');
    const chatNameElement = document.getElementById('chatName');
    const newMessageElement = document.getElementById('newMessage');
    let currentChat = null;

// Get the chat list
    function fetchMessages() {
        fetch('/api/messages/')
            .then(response => response.json())
            .then(data => {
                const userMessages = data.messages;
                const usersWithChats = new Set();

                // Collect all users who have chat records with the current user
                userMessages.forEach(msg => {
                    if (msg.sender === "{{ request.user.username }}") {
                        usersWithChats.add(msg.receiver);
                    } else {
                        usersWithChats.add(msg.sender);
                    }
                });

                // Filter out users with chat records
                const usersWithChatsArray = Array.from(usersWithChats);
                renderChatList(usersWithChatsArray);
            });
    }

    // Render the chat list
    function renderChatList(users, isSearchResult = false) {
        chatListElement.innerHTML = '';

        if (users.length === 0) {
            chatListElement.innerHTML = `<li>${isSearchResult ? 'No users found' : 'No messages available'}</li>`;
            return;
        }

        users.forEach(user => {
            const listItem = document.createElement('li');
            listItem.textContent = typeof user === 'string' ? user : user.username;

            listItem.onclick = () => {
                const username = typeof user === 'string' ? user : user.username;
                if (isSearchResult) {
                    startNewChat(username);
                } else {
                    selectChat(username);
                }
            };

            chatListElement.appendChild(listItem);
        });
    }


    // Search users
    function searchUsers() {
        const query = document.getElementById('searchQuery').value;
        fetch(`/api/search_users/?q=${query}`)
            .then(response => response.json())
            .then(data => {
                const users = data.users.map(user => user.username || user);

                renderChatList(users, true);
            });
    }


    // select chat
    function selectChat(username) {
        currentChat = username;
        chatNameElement.textContent = `Chat with ${username}`;
        loadChatMessages(username);
    }

    // load chat messages
    function loadChatMessages(username) {
        fetch(`/api/messages/?receiver=${username}`)
            .then(response => response.json())
            .then(data => {
                chatBoxElement.innerHTML = '';
                const currentUser = "{{ request.user.username }}"; 

                data.messages.forEach(msg => {
                    const messageElement = document.createElement('div');

                    if (msg.sender === currentUser) {
                        messageElement.classList.add('sent'); 
                    } else {
                        messageElement.classList.add('received'); 
                    }

                    messageElement.textContent = msg.text;
                    chatBoxElement.appendChild(messageElement);
                });

                chatBoxElement.scrollTop = chatBoxElement.scrollHeight;
            });
    }

    // initialize chat
    function initializeChat() {
        fetch('/api/messages/')
            .then(response => response.json())
            .then(data => {
                if (data.messages.length > 0) {
                    const firstChat = data.messages[0].sender !== "{{ request.user.username }}"
                        ? data.messages[0].sender
                        : data.messages[0].receiver;
                    selectChat(firstChat);
                }
            });
    }

    initializeChat();

    // start a new chat
    function startNewChat(username) {
        currentChat = username;
        chatNameElement.textContent = `Chat with ${username}`;
        chatBoxElement.innerHTML = ''; 

        loadChatMessages(username);
    }


    // send messages
    function sendMessage() {
        const text = newMessageElement.value;
        if (!text || !currentChat) return;

        fetch('/api/send/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': document.cookie.split(';').find(item => item.trim().startsWith('csrftoken=')).split('=')[1]
            },
            body: `receiver=${currentChat}&text=${text}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                newMessageElement.value = '';
                loadChatMessages(currentChat);
            }
        });
    }



    fetchMessages();
</script>
{% endblock %}

<!-- FontAwesome icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- CSS style -->
<style>
    .chat-container {
        display: flex;
        height: 90vh;
    }

    /* left chat list */
    .sidebar {
        width: 30%;
        background-color: #f4f4f8;
        padding: 10px;
        overflow-y: auto;
        border-right: 1px solid #ddd;
    }

    .search-bar {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
    }

    .search-input {
        flex-grow: 1;
        padding: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }

    .search-btn {
        background-color: #007bff;
        color: #fff;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
    }

    .chat-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .chat-list li {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
        transition: background 0.2s;
    }

    .chat-list li:hover {
        background-color: #f1f1f1;
    }

    /* right chat bar */
    .chat-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
    }

    .chat-header {
        padding: 10px;
        background-color: #fafafa;
        border-bottom: 1px solid #ddd;
    }

    .chat-box {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        background-color: #fff;
        border: 1px solid #ddd;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
    }

    /* sent messages */
    .sent {
        background-color: #d1e7dd; /* green */
        color: #155724; /* green */
        align-self: flex-end;
        padding: 10px;
        margin: 5px;
        border-radius: 16px;
        max-width: 70%;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

/* received message */
    .received {
        background-color: #f8d7da; /* red */
        color: #721c24; /* red */
        align-self: flex-start;
        padding: 10px;
        margin: 5px;
        border-radius: 16px;
        max-width: 70%;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .chat-footer {
        display: flex;
        gap: 5px;
    }

    .message-input {
        flex-grow: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }

    .send-btn {
        background-color: #28a745;
        color: #fff;
        border: none;
        padding: 8px 15px;
        border-radius: 4px;
        cursor: pointer;
    }

</style>

{% endblock %}
