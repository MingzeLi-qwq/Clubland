{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="chat-container">
    <!-- 左侧消息列表 -->
    <div class="sidebar">
        <h5>Messages</h5>

        <!-- 搜索栏和搜索按钮 -->
        <div style="display: flex; gap: 5px;">
            <input type="text" id="searchQuery" placeholder="Search users..." class="search-input">
            <button onclick="searchUsers()" class="search-btn">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <ul class="chat-list" id="chatList">
            <!-- 动态填充聊天列表 -->
        </ul>
    </div>

    <!-- 右侧聊天框 -->
    <div class="chat-content">
        <div class="chat-header">
            <strong id="chatName">Select a chat</strong>
            <button class="btn btn-outline-secondary btn-sm">Setting</button>
        </div>

        <div class="chat-box" id="chatBox">
            <!-- 消息列表 -->
        </div>

        <!-- 输入框 -->
        <div class="chat-footer">
            <textarea id="newMessage" placeholder="Input Message..." class="message-input"></textarea>
            <button onclick="sendMessage()" class="send-btn">Send</button>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    const chatListElement = document.getElementById('chatList');
    const chatBoxElement = document.getElementById('chatBox');
    const chatNameElement = document.getElementById('chatName');
    const newMessageElement = document.getElementById('newMessage');
    let currentChat = null;

    // 获取所有消息
    function fetchMessages() {
        fetch('/api/messages/')
            .then(response => response.json())
            .then(data => {
                const messages = data.messages;
                renderChatList(messages);
            });
    }

    // 渲染聊天列表
    function renderChatList(messages) {
        chatListElement.innerHTML = '';
        messages.forEach((msg, index) => {
            const listItem = document.createElement('li');
            listItem.textContent = msg.sender;
            listItem.onclick = () => selectChat(index);
            chatListElement.appendChild(listItem);
        });
    }

    // 搜索用户
    function searchUsers() {
        const query = document.getElementById('searchQuery').value;
        fetch(`/api/search_users/?q=${query}`)
            .then(response => response.json())
            .then(data => {
                const users = data.users;
                renderChatList(users);
            });
    }

    // 选择对话
    function selectChat(index) {
        currentChat = index;
        chatNameElement.textContent = `Chat with ${index}`;
        loadChatMessages(index);
    }

    // 加载聊天消息
    function loadChatMessages(index) {
        // 假设我们根据聊天索引来加载消息
        // 这里应该通过 API 获取聊天内容
        chatBoxElement.innerHTML = ''; // 清空当前消息
        // 在此处可以添加代码从后端加载当前聊天的历史消息
    }

    // 发送消息
    function sendMessage() {
        const text = newMessageElement.value;
        if (!text || !currentChat) return;

        fetch('/api/send/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': document.cookie.split(';').find(item => item.trim().startsWith('csrftoken=')).split('=')[1]
            },
            body: `receiver=${currentChat}&text=${text}`
        }).then(response => response.json())
          .then(data => {
              if (data.status === 'success') {
                  loadChatMessages(currentChat);  // 重新加载聊天
              }
          });
    }

    // 初始化加载消息
    fetchMessages();
</script>
{% endblock %}

<!-- 引入 FontAwesome 图标库 -->

</style>

{% endblock %}
