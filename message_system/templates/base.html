{% extends 'base.html' %}
{% load static %}

{% block content %}
<div id="app">
    <div class="chat-container">
        <div class="sidebar">
            <h5>消息中心</h5>
            <ul class="chat-list">
                <li v-for="(chat, index) in chatList" :key="index" @click="selectChat(index)" :class="{ active: currentChatIndex === index }">
                    <img :src="chat.avatar" alt="Avatar">
                    <div>
                        <strong>{{ chat.name }}</strong>
                        <p style="margin:0; font-size: 12px; color: gray;">{{ chat.lastMessage }}</p>
                    </div>
                </li>
            </ul>
        </div>

        <div class="chat-content">
            <div class="chat-header">
                <strong>{{ currentChat.name }}</strong>
                <button class="btn btn-outline-secondary btn-sm">设置</button>
            </div>

            <div class="chat-box">
                <div v-for="(msg, index) in currentChat.messages" :key="index" :class="['chat-message', msg.sender]">
                    <p>{{ msg.text }}</p>
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" v-model="newMessage" placeholder="输入消息...">
                <button @click="sendMessage">发送</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3.2.36/dist/vue.global.js"></script>
<script>
const app = Vue.createApp({
    data() {
        return {
            chatList: [
                { name: "chat1", avatar: "https://via.placeholder.com/40", lastMessage: "hi", messages: [{ text: "hi", sender: "other" }] },
                { name: "chat2", avatar: "https://via.placeholder.com/40", lastMessage: "hi", messages: [{ text: "hi", sender: "other" }] },
                { name: "chat3", avatar: "https://via.placeholder.com/40", lastMessage: "hi", messages: [{ text: "hi", sender: "other" }] }
            ],
            currentChatIndex: 0,
            newMessage: "",
        };
    },
    computed: {
        currentChat() {
            return this.chatList[this.currentChatIndex];
        }
    },
    methods: {
        selectChat(index) {
            this.currentChatIndex = index;
        },
        sendMessage() {
            if (this.newMessage.trim()) {
                this.currentChat.messages.push({ text: this.newMessage, sender: "me" });
                this.newMessage = "";
            }
        }
    }
}).mount("#app");
</script>
{% endblock %}
