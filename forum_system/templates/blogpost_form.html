{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h2 class="mb-0">新建博客文章</h2>
    </div>
    <div class="card-body">
      <!-- 自动加载 CKEditor 所需的媒体文件 -->
      {{ form.media }}
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group">
            <label for="{{ field.id_for_label }}" class="col-form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small">
                {{ field.errors }}
              </div>
            {% endif %}
          </div>
        {% endfor %}
        <div class="form-group text-center">
          <button type="submit" class="btn btn-outline-secondary">提交</button>
        </div>
      </form>
    </div>
  </div>
  <div class="mt-3 text-center">
    <a href="{% url 'forum_system:blog_list' %}" class="btn btn-link">返回列表</a>
  </div>
</div>
{% endblock %}
