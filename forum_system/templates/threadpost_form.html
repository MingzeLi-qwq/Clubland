{% if user.is_authenticated %}
  <h4>添加讨论</h4>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      {{ form.text.label_tag }}  <!-- 修改后的标签语义，如需调整请自行改变 -->
      {{ form.text }}
    </div>
    <button type="submit" class="btn btn-secondary">提交讨论</button>
  </form>
{% else %}
  <p>请<a href="{% url 'login' %}">登录</a>后参与讨论</p>
{% endif %}
