{% extends "base.html" %}
{% block body %}
<div class="container mt-5">
  <h2>确认删除博客文章</h2>
  <p>你确定要删除 "{{ object.title }}" 吗？</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">删除</button>
    <a href="{% url 'forum_system:blog_detail' object.pk %}" class="btn btn-secondary">取消</a>
  </form>
</div>
{% endblock %}
