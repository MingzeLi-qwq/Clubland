{% extends "base.html" %}

{% block body %}
<div class="container my-4">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title mb-0">{{ post.title }}</h2>
      <p class="card-subtitle text-muted">
        <small>
          {{ post.created_at|date:"Y-m-d H:i" }}
          {% if post.author %}
            &nbsp;|&nbsp; 作者：{{ post.author }}
          {% endif %}
        </small>
      </p>
    </div>
    <div class="card-body">
      <div class="card-text">
        {{ post.content|safe }}
      </div>
    </div>
  </div>
  <div class="mt-3">
    <a href="{% url 'forum_system:blog_list' %}" class="btn btn-primary">返回列表</a>
  </div>
</div>
{% endblock %}
