{% extends "base.html" %}

{% block body %}
  <article>
    <h2>{{ post.title }}</h2>
    <p><small>{{ post.created_at|date:"Y-m-d H:i" }}</small></p>
    <div class="content">
      {{ post.content|safe }}
    </div>
  </article>
  <a href="{% url 'forum_system:blog_list' %}">返回列表</a>
{% endblock %}
