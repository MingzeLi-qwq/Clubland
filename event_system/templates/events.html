{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="container">
    <h1 class="my-4 text-center">Welcome to the Events Hub</h1>
    <p class="text-center">Explore and join exciting events happening in your community.</p>

    <!-- 两个按钮，跳转到不同的页面 -->
    <div class="d-flex justify-content-center mt-4 gap-3">
        <a href="{% url 'event_list' %}" class="btn btn-primary btn-lg">Browse Events</a>
        <a href="{% url 'event_detail' pk=1 %}" class="btn btn-secondary btn-lg">View Event Details</a>
    </div>

    <!-- 加载 event_list.html -->
    <div class="mt-5">
        {% include 'event_list.html' %}
    </div>
</div>
{% endblock %}
