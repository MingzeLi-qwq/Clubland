{% if user.is_authenticated %}
  <h4>添加评论</h4>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <!-- {{ form.text.label_tag }} -->
      {{ form.text }}
    </div>
    <button type="submit" class="btn btn-secondary">提交评论</button>
  </form>
{% else %}
  <p>请<a href="{% url 'login' %}">登录</a>后评论</p>
{% endif %}
