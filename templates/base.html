<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学生会平台{% endblock %}</title>
    {% load static %}
    <style>
        /* 提取的样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f4f4f4;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        header .user-actions {
            display: flex;
            gap: 10px;
        }
        header .user-actions a {
            text-decoration: none;
            color: #333;
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>学生会主页</h1>
        <div class="search-bar">
            <input type="text" placeholder="搜索社团">
        </div>
        <div class="user-actions">
            {% if user.is_authenticated %}
                <a href="{% url 'user_center' %}">用户中心</a>
            {% else %}
                <a href="{% url 'login' %}">登录</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
