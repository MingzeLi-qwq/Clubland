<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学生会平台{% endblock %}</title>
    {% load static %}
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .club-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .club {
            flex: 1 1 calc(33.333% - 20px);
            margin: 10px;
            box-sizing: border-box;
        }
        @media (max-width: 768px) {
            .club {
                flex: 1 1 calc(50% - 20px);
            }
        }
        @media (max-width: 480px) {
            .club {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm p-3 mb-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">学生会主页</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto d-flex align-items-center gap-3">
                    <input class="form-control" type="text" placeholder="搜索社团">
                    {% if user.is_authenticated %}
                        <a class="btn btn-outline-primary" href="{% url 'user_center' %}">用户中心</a>
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger">登出</button>
                        </form>
                    {% else %}
                        <a class="btn btn-outline-success" href="{% url 'login' %}">登录／注册</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
