<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学生会平台{% endblock %}</title>
    {% load static %}
    <style>
        /* 提取的样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f4f4f4;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        header .user-actions {
            display: flex;
            gap: 10px;
        }
        header .user-actions a {
            text-decoration: none;
            /* color: #333;
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px; */
        }

        header .user-actions a:visited {
    color: inherit;
}

header .user-actions a:hover {
    text-decoration: none; /* 悬停时也没有下划线 */
    color: inherit;        /* 悬停时颜色不变 */
}

        .club-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
}
.club {
    flex: 1 1 calc(33.333% - 20px); /* 每行显示三个，减去间距 */
    margin: 10px;
    box-sizing: border-box;
}
@media (max-width: 768px) {
    .club {
        flex: 1 1 calc(50% - 20px); /* 平板设备每行显示两个 */
    }
}
@media (max-width: 480px) {
    .club {
        flex: 1 1 100%; /* 手机设备每行显示一个 */
    }
}

    </style>
</head>
<body>
    <header>
        <h1>学生会主页</h1>
        <div class="search-bar">
            <input type="text" placeholder="搜索社团">
        </div>
        <div class="user-actions">
            {% if user.is_authenticated %}
        <button><a href="{% url 'user_center' %}">用户中心</a></button>
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" >登出</button>
            </form>
        {% else %}
    <button><a href="{% url 'login' %}">登录／注册</a></button>
        {% endif %}
        
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
