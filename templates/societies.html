{% extends 'base.html' %}

{% block body %}
<div class="container mt-5">
  <h1 class="display-4 fw-bold">Societies</h1>
  <p class="lead">Explore our student societies.</p>
  <div class="row">
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <img src="{% static 'img/coding-club.jpg' %}" class="card-img-top" alt="Coding Club">
        <div class="card-body">
          <h5 class="card-title">Coding Club</h5>
          <p class="card-text">Weekly workshops and hackathons.</p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <img src="{% static 'img/debate.jpg' %}" class="card-img-top" alt="Debate Club">
        <div class="card-body">
          <h5 class="card-title">Debate Club</h5>
          <p class="card-text">Monthly inter-school competitions.</p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <img src="{% static 'img/music.jpg' %}" class="card-img-top" alt="Music Society">
        <div class="card-body">
          <h5 class="card-title">Music Society</h5>
          <p class="card-text">Open mic nights every Friday.</p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
