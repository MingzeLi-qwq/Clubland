{% extends 'base.html' %}

{% block title %}创建活动{% endblock %}

{% block content %}
    <h1>为 {{ club.name }} 创建活动</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">创建</button>
    </form>
    <a href="{% url 'club_detail' club.id %}" class="btn btn-secondary">返回社团</a>
{% endblock %}
