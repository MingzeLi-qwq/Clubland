{% extends 'base.html' %}

{% block title %}创建新闻{% endblock %}

{% block content %}
    <h1>为 {{ club.name }} 创建新闻</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">创建</button>
    </form>
    <a href="{% url 'club_detail' club.id %}">返回社团</a>
{% endblock %}
