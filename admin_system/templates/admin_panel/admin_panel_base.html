{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="container mt-5 mb-4">
    <!-- 标题 -->
    <div class="d-flex justify-content-between align-items-center">
        <h2>Admin Panel</h2>
    </div>

    <div class="row mt-4 gy-3">
        <!-- 侧边菜单栏 -->
        <div class="col-md-3">
            <div class="list-group">
                <a href="{% url 'admin_panel_clubs' %}" class="list-group-item list-group-item-action">
                    Clubs
                </a>
                <a href="{% url 'admin_panel_users' %}" class="list-group-item list-group-item-action">
                    Users
                </a>
                <a href="{% url 'admin_panel_requests' %}" class="list-group-item list-group-item-action">
                    Requests
                </a>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="col-md-9">
            <!-- 错误信息框样式  -->
            <style>
                .alert-error {
                    background-color: #f8d7da;
                    color: #721c24;
                    border-color: #f5c6cb;
                }
            </style>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mt-2">
                    {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block panel_content %}
            <!-- 动态内容区域 -->
            {% endblock %}
        </div>
    </div>
</div>

{% endblock %}
