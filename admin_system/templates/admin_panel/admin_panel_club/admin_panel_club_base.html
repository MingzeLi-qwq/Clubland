{% extends 'base.html' %}
{% load static %}

{% block body %}
<style>
    /* Add rounded corners to all controls */
    .card, .form-control, .list-group {
      border-radius: 12px;
    }
</style>

<div class="container mt-5 mb-4">

    <!-- title -->
    <div class="d-flex justify-content-between align-items-center">
        <h2>
            <span class="text-secondary">Admin Panel - </span>
            Club: {{ club.name }}
        </h2>
    </div>

    <div class="row mt-4 gy-3">
        <!-- Side menu bar -->
        <div class="col-md-3">
            <div class="list-group">
                <a href="{% url 'admin_panel_clubs' %}" class="list-group-item list-group-item-action bg-primary text-white">
                    <i class="bi bi-arrow-left"></i> To Admin Panel
                </a>
                <a href="{% url 'admin_panel_club_general' club_id=club.club_id %}" class="list-group-item list-group-item-action">
                    General
                </a>
                <a href="{% url 'admin_panel_club_members' club_id=club.club_id %}" class="list-group-item list-group-item-action">
                    Members
                </a>
                <a href="{% url 'admin_panel_club_news' club_id=club.club_id %}" class="list-group-item list-group-item-action">
                    News
                </a>
                <a href="{% url 'admin_panel_club_events' club_id=club.club_id %}" class="list-group-item list-group-item-action">
                    Events
                </a>
                <a href="{% url 'admin_panel_club_dashboard' club_id=club.club_id %}" class="list-group-item list-group-item-action">
                    Hub
                </a>
            </div>
        </div>

        <!-- main content -->
        <div class="col-md-9">
            <!-- Error message box style  -->
            <style>
                .alert-error {
                    background-color: #f8d7da;
                    color: #721c24;
                    border-color: #f5c6cb;
                }
            </style>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mt-2">
                    {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block panel_content %}
            <!-- Dynamic content area -->
            {% endblock %}
        </div>
    </div>
</div>

{% endblock %}
