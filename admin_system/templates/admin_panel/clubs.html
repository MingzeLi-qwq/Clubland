{% extends "admin_panel/admin_panel_base.html" %}

{% block panel_title %}Admin Panel{% endblock %}

{% block panel_content %}

<h4>Clubs</h4>

<div class="card p-3 mb-3 shadow-sm">
    <h5>All Clubs ({{club_count}})</h5>
    
    <!-- 添加搜索框 -->
    <form method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="Search clubs" value="{{ search_query }}">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <!-- 显示clubs列表 -->
    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr>
                <td>{{ club.club_id }}</td>
                <td>{{ club.name }}</td>
                <td>
                    <!-- 这里可以添加操作按钮,如编辑、删除等 -->
                    <a href="#" class="btn btn-outline-primary btn-sm">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
