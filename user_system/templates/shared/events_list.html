{% for event in events %}
<div class="col-md-4">
    <div class="event-card card shadow-sm">
        <div class="card-body">
            <h5 class="card-title fw-bold">{{ event.name }}</h5>
            <div class="event-info">
                <div class="info-item">
                    <i class="bi-calendar-event"></i>
                    <small>{{ event.start_time|date:"M d, Y H:i" }}</small>
                </div>
                <div class="info-item">
                    <i class="bi-geo-alt"></i>
                    <small>{{ event.location }}</small>
                </div>
            </div>
            <a href="{% url 'event_detail' event.pk %}" class="btn btn-outline-primary btn-sm">
                View Details
            </a>
        </div>
    </div>
</div>
{% empty %}
<div class="col-12 text-center py-4">
    <p class="text-muted">No upcoming events at the moment</p>
</div>
{% endfor %}
