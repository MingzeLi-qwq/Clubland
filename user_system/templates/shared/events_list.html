{% if events %}
  {% for event in events %}
    <div class="col-md-4 mb-4">
      <div class="card h-100 border-0 shadow-sm hover-shadow event-card">
        <div class="card-body">
          <h5 class="card-title">{{ event.name }}</h5>
          <p class="card-text text-muted mb-2">{{ event.content|striptags|truncatechars:100 }}</p>
          
          <div class="d-flex align-items-center mb-2">
            <i class="bi bi-calendar-event text-primary me-2"></i>
            <small>{{ event.start_time|date:"Y年m月d日 H:i" }}</small>
          </div>
          
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-geo-alt text-primary me-2"></i>
            <small>{{ event.location }}</small>
          </div>
          
          {% if event.club %}
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-people text-primary me-2"></i>
            <small>{{ event.club.name }}</small>
          </div>
          {% endif %}
          
          <div class="countdown" data-start-time="{{ event.start_time|date:'c' }}">
            <span class="badge bg-primary">即将开始</span>
          </div>
          
          <a href="{% url 'event_detail' event.id %}" class="btn btn-primary btn-sm mt-3 w-100">查看活动</a>
        </div>
      </div>
    </div>
  {% endfor %}
{% else %}
  <div class="col-12 text-center">
    <div class="p-5 bg-light rounded">
      <h4 class="text-muted">暂无活动</h4>
      <p>请稍后再来查看最新活动</p>
    </div>
  </div>
{% endif %}
