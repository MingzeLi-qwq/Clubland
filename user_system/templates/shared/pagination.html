<div class="d-flex justify-content-between align-items-center mt-4">
    <div class="view-all-card">
        {% if events.has_previous %}
        <a href="#" 
           class="btn btn-light shadow-sm rounded-pill px-4 pagination-btn"
           data-page="{{ events.previous_page_number }}">
            <i class="bi-arrow-left me-2"></i> Previous
        </a>
        {% endif %}
    </div>

    <div class="text-muted">
        Page <span id="current-page">{{ events.number }}</span> of <span id="total-pages">{{ events.paginator.num_pages }}</span>
    </div>

    <div class="view-all-card">
        {% if events.has_next %}
        <a href="#" 
           class="btn btn-light shadow-sm rounded-pill px-4 pagination-btn"
           data-page="{{ events.next_page_number }}">
            Next <i class="bi-arrow-right ms-2"></i>
        </a>
        {% endif %}
    </div>
</div>
