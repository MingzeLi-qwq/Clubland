{% if events.has_other_pages %}
  <div class="pagination d-flex justify-content-center align-items-center">
    {% if events.has_previous %}
      <a href="#" class="pagination-btn btn btn-sm btn-outline-primary rounded-pill px-3 me-2" data-page="{{ events.previous_page_number }}">
        <i class="bi bi-chevron-left me-1"></i> Previous page
      </a>
    {% else %}
      <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 me-2" disabled>
        <i class="bi bi-chevron-left me-1"></i> Previous page
      </button>
    {% endif %}
    
    <span class="px-3">{{ events.number }} / {{ events.paginator.num_pages }}</span>
    
    {% if events.has_next %}
      <a href="#" class="pagination-btn btn btn-sm btn-outline-primary rounded-pill px-3 ms-2" data-page="{{ events.next_page_number }}">
        Next Page <i class="bi bi-chevron-right ms-1"></i>
      </a>
    {% else %}
      <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 ms-2" disabled>
        Next Page <i class="bi bi-chevron-right ms-1"></i>
      </button>
    {% endif %}
  </div>
{% endif %}
