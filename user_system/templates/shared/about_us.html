{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="container mt-5">
  <div class="row mb-5">
    <div class="col-12 text-center">
      <h1 class="display-4 fw-bold mb-4">About Us</h1>
      <p class="lead text-muted">学生会管理平台</p>
    </div>
  </div>

  <!-- 关于平台 -->
  <section class="py-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h2 class="display-6 fw-bold mb-4">关于学生会平台</h2>
          <p class="mb-4">旨在便于学生社团管理、活动组织和校园信息传递。</p>
          <ul class="list-unstyled">
            <li class="d-flex mb-4">
              <div class="flex-shrink-0 text-primary fs-3 me-3">
                <i class="bi-people"></i>
              </div>
              <div>
                <h3 class="h5">校园社区</h3>
                <p class="text-muted mb-0">连接全校社团和学生，促进校园文化建设</p>
              </div>
            </li>
            <li class="d-flex mb-4">
              <div class="flex-shrink-0 text-primary fs-3 me-3">
                <i class="bi-calendar-check"></i>
              </div>
              <div>
                <h3 class="h5">活动管理</h3>
                <p class="text-muted mb-0">简化社团活动的组织、宣传和管理流程</p>
              </div>
            </li>
            <li class="d-flex mb-4">
              <div class="flex-shrink-0 text-primary fs-3 me-3">
                <i class="bi-info-circle"></i>
              </div>
              <div>
                <h3 class="h5">信息共享</h3>
                <p class="text-muted mb-0">为学生提供及时、准确的校园资讯</p>
              </div>
            </li>
          </ul>
        </div>

      </div>
    </div>
  </section>
  
  
</div>

<!-- 底部空白 -->
<div class="bg-light" style="height: 50px;"></div>
{% endblock %}

{% block extra_css %}
<style>
  .feature-icon {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hover-scale {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .hover-scale:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15)!important;
  }
</style>
{% endblock %}
