{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="signup-container">
    <div class="signup-box shadow-lg">
        <h2 class="text-center fw-bold mb-4">Sign Up</h2>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    {{ field.label_tag }}
                    {{ field }}

                    {% if field.errors %}
                        <div class="invalid-feedback d-block">
                            {% for error in field.errors %}
                                {{ error }}<br>
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>

        <p class="text-center mt-3">
            Already have an account? <a href="{% url 'login' %}" class="text-primary">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
