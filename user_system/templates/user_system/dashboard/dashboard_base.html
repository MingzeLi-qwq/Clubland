{% extends 'base.html' %}
{% load static %}

{% block body %}
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Account Dashboard</h2>
            <a href="{% url 'logout' %}" class="btn btn-primary">Sign Out</a>
        </div>
        <p class="text-muted">Manage your account settings, security, and personal information.</p>
    
        <div class="d-flex align-items-center">
            <div class="rounded-circle bg-light d-flex justify-content-center align-items-center" 
                 style="width: 80px; height: 80px;">
                <i class="fas fa-user fa-2x text-secondary"></i>
            </div>
            <div class="ms-3">
                <h5>{{ user.first_name }} {{ user.last_name }}</h5>
            </div>
        </div>
    
        <div class="row mt-4 gy-3">
            <div class="col-md-4">
                <div class="list-group">
                    <a href="{% url 'dashboard_personal_information' %}" class="list-group-item list-group-item-action">
                        Personal Information
                    </a>
                    <a href="{% url 'dashboard_my_club' %}" class="list-group-item list-group-item-action">
                        My Club
                    </a>
                </div>
            </div>
    
            <div class="col-md-8">
                {% block dashboard_content %}
                <!-- 动态内容区域 -->
                {% endblock %}       
            </div>
        </div>
    </div>
    
{% endblock %}
