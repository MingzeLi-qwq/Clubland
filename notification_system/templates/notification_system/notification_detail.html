{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4">Notification Detail</h2>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-3">{{ notification.title }}</h5>
                    <p class="card-text">{{ notification.message }}</p>
                    
                    <hr class="my-4">
                    
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Send at: </strong> {{ notification.created_at|date:"Y-m-d H:i" }}</p>
                        </div>
                    </div>
                    
                    {% if notification.url %}
                    <div class="mt-4">
                        <a href="{{ notification.url }}" class="btn btn-primary">
                            <i class="bi bi-arrow-up-right-square"></i> Continue
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
            
            <div class="mt-4">
                <a href="{% url 'notifications' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Notification List
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
