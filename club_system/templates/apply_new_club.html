{% extends 'base.html' %}

{% block body %}

    <!-- 错误信息框样式  -->
    <style>
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
    </style>

  <div class="container">
    <h2 class="text-center my-4">Apply for a New Club</h2>
    
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mt-2">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Submit Application</button>
    </form>
  </div>

{% endblock %}
