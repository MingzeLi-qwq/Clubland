{% extends "club_manager/club_manager_base.html" %}

{% block manager_title %}Members{% endblock %}

{% block manager_content %}

<!-- 错误信息框样式  -->
<style>
  .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border-color: #f5c6cb;
  }
  </style>
  
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} mt-2">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  
  <div class="mb-4">
    <h3>Club managers</h3>
  </div>
  
  {% endblock %}
